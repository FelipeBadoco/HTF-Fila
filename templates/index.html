<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTF Monitoring</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #0f172a;
            --accent: #3b82f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
            --header-bg: #f8fafc;
            --table-hover: #f8fafc;
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --input-text: #1e293b;
            --transition-speed: 0.3s;
        }

        body.dark-theme {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --primary: #f8fafc;
            --accent: #3b82f6;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2), 0 2px 4px -2px rgb(0 0 0 / 0.2);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
            --header-bg: #111a2e;
            --table-hover: #1e293b;
            --input-bg: #1e293b;
            --input-border: #334155;
            --input-text: #f8fafc;
        }

        body, .navbar, .stat-card, .content-panel, .panel-header, .table-clean, th, td, input, select, button {
            transition: background-color var(--transition-speed) ease, 
                        border-color var(--transition-speed) ease, 
                        color var(--transition-speed) ease, 
                        box-shadow var(--transition-speed) ease;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1.25rem 0;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }

        .navbar-brand img {
            height: 55px;
            border-radius: 10px;
        }

        .header-section {
            padding: 3rem 0 2rem;
        }

        .header-section h1 {
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.025em;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color var(--transition-speed) ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .bg-blue-light {
            background: #eff6ff;
            color: #3b82f6;
        }
        body.dark-theme .bg-blue-light {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .bg-purple-light {
            background: #faf5ff;
            color: #a855f7;
        }
        body.dark-theme .bg-purple-light {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
        }

        .bg-emerald-light {
            background: #ecfdf5;
            color: #10b981;
        }
        body.dark-theme .bg-emerald-light {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0px;
            line-height: 1.2;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .content-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-top: 2rem;
        }

        .panel-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--header-bg);
        }

        .panel-header h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0;
            color: var(--primary);
        }

        .table-clean {
            width: 100%;
            margin: 0;
            color: var(--text-main);
        }

        .table-clean thead th {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 1.5rem;
            text-align: center;
        }

        .table-clean tbody td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            text-align: center;
            font-size: 0.9375rem;
            color: var(--text-main);
        }

        .table-clean tbody tr:last-child td {
            border-bottom: none;
        }

        .table-clean tbody tr:hover {
            background: var(--table-hover);
        }

        select option {
            background: var(--card-bg);
            color: var(--text-main);
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .badge-clean {
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
        }

        .status-processing {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .status-success {
            background: #ecfdf5;
            color: #047857;
        }

        .status-warning {
            background: #fffbeb;
            color: #b45309;
        }

        .status-error {
            background: #fef2f2;
            color: #b91c1c;
        }

        body.dark-theme .status-processing {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        body.dark-theme .status-success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        body.dark-theme .status-warning {
            background: rgba(245, 158, 11, 0.25);
            color: #fbbf24;
        }

        body.dark-theme .status-error {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .hash-cell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--header-bg);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            max-width: 100%;
        }

        .hash-text {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--text-main);
            letter-spacing: 0.4px;
            user-select: all;
        }

        .btn-copy-hash {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0 2px;
            font-size: 0.85rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.15s ease, transform 0.15s ease;
            outline: none;
        }

        .btn-copy-hash:hover {
            color: var(--accent);
            transform: scale(1.15);
        }

        .btn-copy-hash:focus {
            outline: none;
        }

        .progress-clean {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            width: 100px;
            margin: 0 auto;
            position: relative;
        }

        .progress-clean.is-waiting::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(59, 130, 246, 0.45) 50%, transparent 100%);
            animation: sweep-shimmer 1.8s ease-in-out infinite;
        }

        @keyframes sweep-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-bar.progress-animated {
            background-image: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.25) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0.25) 75%,
                transparent 75%,
                transparent
            );
            background-size: 16px 16px;
            animation: progress-stripes 1s linear infinite;
        }

        @keyframes progress-stripes {
            0% {
                background-position: 16px 0;
            }
            100% {
                background-position: 0 0;
            }
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }


        /* Easter Egg Modal */
        .ee-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
        }

        .ee-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            max-width: 400px;
            width: 90%;
            transform: scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 1px solid var(--border);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popIn {
            to {
                transform: scale(1);
            }
        }

        .ee-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
        }

        .ee-linkedin-btn {
            background: #0077b5;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            text-decoration: none;
        }

        .ee-linkedin-btn:hover {
            background: #005a8a;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 119, 181, 0.3);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .table-clean thead {
                display: none;
            }

            .table-clean td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.75rem 1.5rem;
                text-align: right;
            }

            .table-clean td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-muted);
                margin-right: 1rem;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="javascript:void(0)" onclick="handleLogoClick()">
                <img src="https://santacasabraganca.com.br/assets/images/logo.png" alt="Santa Casa">
            </a>
            <div class="d-flex align-items-center" style="gap: 15px;">
                <button id="theme-toggle" class="btn btn-link text-muted p-0 mr-3" onclick="toggleTheme()" style="font-size: 1.25rem; text-decoration: none; border: none; background: transparent; outline: none; box-shadow: none;">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="sync-indicator">
                    <div class="dot"></div>
                    <span id="update-status">Sincronizado</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Easter Egg Modal -->
    <div id="ee-modal" class="ee-modal" onclick="closeEE()">
        <div class="ee-card" onclick="event.stopPropagation()">
            <div class="ee-avatar">
                <i class="fas fa-code"></i>
            </div>
            <h4 class="font-weight-bold mb-2">Desenvolvido por</h4>
            <h5 class="text-primary mb-3">Felipe Badoco</h5>
            <a href="https://www.linkedin.com/in/felipe-badoco/" target="_blank" class="ee-linkedin-btn">
                <i class="fab fa-linkedin"></i> Conectar no LinkedIn
            </a>
            <button class="btn btn-link text-muted mt-3 d-block w-100" onclick="closeEE()">Fechar</button>
        </div>
    </div>

    <div class="container mt-4">
        <div id="alerts-container"></div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="stat-card">
                    <div class="stat-icon bg-blue-light"><i class="fas fa-list-ul"></i></div>
                    <div class="stat-info">
                        <div class="stat-value" id="total-trabalhos">0</div>
                        <div class="stat-label">Total de Trabalhos</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="stat-card">
                    <div class="stat-icon bg-purple-light"><i class="fas fa-copy"></i></div>
                    <div class="stat-info">
                        <div class="stat-value" id="total-paginas">0</div>
                        <div class="stat-label">Páginas Digitalizadas</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="stat-card">
                    <div class="stat-icon bg-emerald-light"><i class="fas fa-bolt"></i></div>
                    <div class="stat-info">
                        <div class="stat-value" id="total-processando">0</div>
                        <div class="stat-label">Em Execução</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-panel">
            <div class="panel-header d-flex flex-column flex-md-row justify-content-between align-items-md-center" style="gap: 15px;">
                <h3 class="m-0">Fila de Trabalhos</h3>
                <div class="d-flex flex-wrap align-items-center" style="gap: 15px;">
                    <!-- Campo de Busca -->
                    <div class="position-relative">
                        <i class="fas fa-search position-absolute text-muted" style="left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.85rem;"></i>
                        <input type="text" id="search-input" class="form-control form-control-sm" placeholder="Buscar trabalhos..." oninput="filterData()" style="padding-left: 32px; width: 180px; border-radius: 8px; background: var(--input-bg); border-color: var(--input-border); color: var(--input-text);">
                    </div>
                    <!-- Seletor de Autorefresh -->
                    <div class="d-flex align-items-center" style="gap: 5px;">
                        <i class="fas fa-clock text-muted" style="font-size: 0.85rem;"></i>
                        <select id="refresh-rate" class="form-control form-control-sm" onchange="updateRefreshInterval()" style="width: 95px; border-radius: 8px; background: var(--input-bg); border-color: var(--input-border); color: var(--input-text);">
                            <option value="3">3s</option>
                            <option value="5">5s</option>
                            <option value="10">10s</option>
                            <option value="30">30s</option>
                            <option value="0">Pausado</option>
                        </select>
                    </div>
                    <!-- Checkbox de Som -->
                    <div class="custom-control custom-checkbox custom-control-inline mr-0">
                        <input type="checkbox" class="custom-control-input" id="sound-alert" checked>
                        <label class="custom-control-label font-weight-normal text-muted" for="sound-alert" style="font-size: 0.85rem; user-select: none;">
                            <i class="fas fa-volume-up"></i> Som
                        </label>
                    </div>
                    <!-- Botão Atualizar -->
                    <button class="btn btn-light btn-sm font-weight-bold" onclick="fetchData()"
                        style="border: 1px solid var(--border); color: var(--text-muted); background: var(--card-bg); border-radius: 8px;">
                        <i class="fas fa-sync-alt mr-1"></i> Atualizar
                    </button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-clean">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Hash</th>
                            <th>Status</th>
                            <th>Progresso</th>
                            <th>Páginas</th>
                            <th>Usuário</th>
                            <th>Site</th>
                            <th>Horário</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_VERSION = "2.3";

        // 🌓 Theme Logic
        function applyTheme(theme) {
            const body = document.body;
            const btn = document.getElementById('theme-toggle');
            if (theme === 'dark') {
                body.classList.add('dark-theme');
                btn.innerHTML = '<i class="fas fa-sun"></i>';
                btn.style.color = '#fbbf24';
            } else {
                body.classList.remove('dark-theme');
                btn.innerHTML = '<i class="fas fa-moon"></i>';
                btn.style.color = '';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-theme');
            const nextTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme', nextTheme);
            applyTheme(nextTheme);
        }

        // Initialize Theme ASAP
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);

        // 🥚 Easter Egg Logic
        let logoClicks = 0;
        let logoTimer;

        function handleLogoClick() {
            logoClicks++;
            clearTimeout(logoTimer);

            if (logoClicks >= 5) {
                document.getElementById('ee-modal').style.display = 'flex';
                logoClicks = 0;
            } else {
                logoTimer = setTimeout(() => { logoClicks = 0; }, 2000);
            }
        }

        function closeEE() {
            document.getElementById('ee-modal').style.display = 'none';
        }

        // 🔊 Audio Alertas Logic
        let previousErrorCount = 0;

        function playNotificationSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.stop(ctx.currentTime + 0.3);
                } else {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, ctx.currentTime); 
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                console.error('AudioContext not allowed or failed:', e);
            }
        }

        function getBadge(state) {
            if (!state) return '<span class="badge-clean status-warning">N/A</span>';
            const s = state.toLowerCase();
            if (s.includes('process')) return `<span class="badge-clean status-processing"><i class="fas fa-sync fa-spin"></i> ${state}</span>`;
            if (s.includes('concl') || s.includes('compl') || s.includes('final')) return `<span class="badge-clean status-success"><i class="fas fa-check"></i> ${state}</span>`;
            if (s.includes('err') || s.includes('fail') || s.includes('falha')) return `<span class="badge-clean status-error"><i class="fas fa-times"></i> ${state}</span>`;
            return `<span class="badge-clean status-warning">${state}</span>`;
        }

        // 📋 Função para Copiar Hash
        function copiarHash(hash, btn) {
            if (!hash || hash === 'N/A') return;

            function animarCopia() {
                const icon = btn.querySelector('i');
                if (icon) {
                    const originalClass = icon.className;
                    icon.className = 'fas fa-check text-success';
                    setTimeout(() => {
                        icon.className = originalClass;
                    }, 1800);
                }
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(hash).then(animarCopia).catch(() => {
                    fallbackCopiar(hash, animarCopia);
                });
            } else {
                fallbackCopiar(hash, animarCopia);
            }
        }

        function fallbackCopiar(texto, callback) {
            const textarea = document.createElement('textarea');
            textarea.value = texto;
            textarea.style.position = 'fixed';
            textarea.style.left = '-999999px';
            textarea.style.top = '-999999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                if (callback) callback();
            } catch (err) {
                console.error('Falha ao copiar:', err);
            }
            document.body.removeChild(textarea);
        }

        // 🔍 Filtro e busca em tempo real
        let currentData = [];

        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderTable(currentData);
                return;
            }
            const filtered = currentData.filter(item => {
                return (item.Name || '').toLowerCase().includes(query) ||
                       (item.Hash || '').toLowerCase().includes(query) ||
                       (item.State || '').toLowerCase().includes(query) ||
                       (item.User || '').toLowerCase().includes(query) ||
                       (item.Site || '').toLowerCase().includes(query);
            });
            renderTable(filtered);
        }

        function renderTable(dados) {
            const tbody = document.getElementById('table-body');
            if (dados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="py-5 text-muted text-center">Nenhum trabalho correspondente encontrado...</td></tr>';
            } else {
                tbody.innerHTML = dados.map(item => `
                    <tr>
                        <td data-label="Nome"><strong>${item.Name}</strong></td>
                        <td data-label="Hash">
                            <div class="hash-cell">
                                <code class="hash-text" title="${item.Hash || 'N/A'}">${(item.Hash && item.Hash !== 'N/A') ? item.Hash.substring(0, 6) : (item.Hash || 'N/A')}</code>
                                <button class="btn-copy-hash" onclick="copiarHash('${item.Hash || ''}', this)" title="Copiar Hash">
                                    <i class="far fa-copy"></i>
                                </button>
                            </div>
                        </td>
                        <td data-label="Status">${getBadge(item.State)}</td>
                        <td data-label="Progresso">
                            <div class="progress-clean ${item.Percentage === 0 ? 'is-waiting' : ''}">
                                <div class="progress-bar ${item.Percentage > 0 && item.Percentage < 100 ? 'progress-animated' : ''}" style="width: ${item.Percentage}%"></div>
                            </div>
                            <small class="text-muted d-block mt-1">${item.Percentage}%</small>
                        </td>
                        <td data-label="Páginas">${item.Pages}</td>
                        <td data-label="Usuário">${item.User}</td>
                        <td data-label="Site"><span class="text-muted">${item.Site}</span></td>
                        <td data-label="Horário" class="text-muted">${item.Time}</td>
                    </tr>
                `).join('');
            }
        }

        // 🔄 Autorefresh Control
        let fetchIntervalId = null;

        function updateRefreshInterval() {
            const select = document.getElementById('refresh-rate');
            const rateSec = parseInt(select.value);
            
            if (fetchIntervalId) {
                clearInterval(fetchIntervalId);
                fetchIntervalId = null;
            }

            if (rateSec > 0) {
                fetchIntervalId = setInterval(fetchData, rateSec * 1000);
            }
        }

        async function fetchData() {
            const statusText = document.getElementById('update-status');
            const dot = document.querySelector('.dot');

            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                // Verifica se há uma versão mais nova para recarregar a página
                if (data.versao && data.versao !== CLIENT_VERSION) {
                    window.location.reload(true);
                    return;
                }

                document.getElementById('total-trabalhos').textContent = data.total_trabalhos;
                document.getElementById('total-paginas').textContent = data.total_paginas.toLocaleString();
                document.getElementById('total-processando').textContent = data.processando;

                // Armazena e filtra/renderiza os dados
                currentData = data.dados;
                filterData();

                // Detecção de Erros e Alerta Sonoro
                let currentErrorCount = 0;
                currentData.forEach(item => {
                    const state = (item.State || '').toLowerCase();
                    if (state.includes('err') || state.includes('fail') || state.includes('falha')) {
                        currentErrorCount++;
                    }
                });

                if (currentErrorCount > previousErrorCount && document.getElementById('sound-alert').checked) {
                    playNotificationSound('error');
                }
                previousErrorCount = currentErrorCount;

                const alertCtn = document.getElementById('alerts-container');
                alertCtn.innerHTML = '';
                if (data.mensagem_servico) {
                    alertCtn.innerHTML = `<div class="alert alert-danger border-0 shadow-sm" style="border-radius:12px"><i class="fas fa-exclamation-circle mr-2"></i> ${data.mensagem_servico}</div>`;
                }

                statusText.textContent = 'Sincronizado: ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                dot.style.background = 'var(--success)';
            } catch (e) {
                statusText.textContent = 'Erro de conexão';
                dot.style.background = 'var(--error)';
            }
        }

        // Inicialização dos processos do dashboard
        fetchData();
        updateRefreshInterval(); // Inicia o temporizador com base no select padrão (3s)

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchData();
            }
        });
    </script>

</body>

</html>
